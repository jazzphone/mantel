<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, viewport-fit=cover, initial-scale=1">
<title>Mantel · Home</title>
<!-- home-screen: the web app on a Home Screen (app_shell.py); taken out through HA's Ingress -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05070e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- /home-screen -->
<link rel="stylesheet" href="/hk/fonts/sf-pro.css">
<link rel="stylesheet" href="/hk/css/hk-responsive.css">
<style>
  html, body { margin: 0; min-height: 100%; background: #05070e; color: #fff;
               font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; }
  /* the view container (web/shim/mantel-shell.js): the sky mounts here, behind the view. The view is
     its DIRECT child, as hui-view is hui-view-container's in HA: the tab bar's room (--hk-tabbar-h)
     pads this element, and cards that fit the window (hk-calendar.js _measure) read it from the
     view's parent. */
  /* border-box: the tab bar's room is INSIDE the window's height, so a page that fits does not scroll
     (content-box made every page 100vh + --hk-tabbar-h tall: a 96 px scroll for nothing) */
  /* clear of the status bar and the Dynamic Island (the iPhone app and a Home Screen web app draw edge to
     edge): Home Assistant's header, or hk-kiosk.js's --safe-area-inset-top, does this there. Zero on a wall
     tablet or a desktop browser; a tab bar at the top sets its own padding-top inline (hk-tabbar.js). */
  hk-view-container { display: block; position: relative; isolation: isolate; min-height: 100vh;
                      box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
  /* the Music page's Now Playing sheet on a phone (hk-music.js, `hk-music-sheet` while it is up): its z-index
     cannot leave this isolated container, so the tab bar (6) and the playing bar (7) in #hk-shell-root drew over
     it and took its taps. While it is up the container stands at 7, after the shell root: over both, under the
     detail sheets (8) and the menu (9); and the page behind it does not scroll (Avery's iPhone, 2026-10-20). */
  html[hk-music-sheet] hk-view-container { z-index: 7; }
  html[hk-music-sheet], html[hk-music-sheet] body { overflow: hidden; }
</style>
</head>
<body>
<div id="hk-shell-root"></div>
<hk-view-container id="view"></hk-view-container>
<script type="module" src="/web/home.js"></script>
</body>
</html>
