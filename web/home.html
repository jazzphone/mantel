<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, viewport-fit=cover, initial-scale=1">
<title>Mantel · Home</title>
<!-- home-screen: the web app on a Home Screen (app_shell.py); taken out through HA's Ingress -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05070e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- /home-screen -->
<link rel="stylesheet" href="/hk/fonts/sf-pro.css">
<link rel="stylesheet" href="/hk/css/hk-responsive.css">
<!-- NO STARTUP WATERFALL (2026-10-29): home.js runs these seven one after another, each in its turn, once the house's
     states are here, and each used to be fetched only when its turn came. Preloaded here they download with the page;
     what runs, and in what order, is still home.js's awaits (a modulepreload only fetches). The cards' own are
     preloaded as soon as their list is known (shim/early-cards.js). Under Ingress the server moves these hrefs under
     the prefix with the others. -->
<link rel="modulepreload" href="/hk/modules/hk-settings-defaults.js">
<link rel="modulepreload" href="/hk/modules/hk-settings.js">
<link rel="modulepreload" href="/hk/iconset/hk-icons.js">
<link rel="modulepreload" href="/hk/modules/tesla-viewport.js">
<link rel="modulepreload" href="/hk/modules/hk-tap.js">
<link rel="modulepreload" href="/hk/modules/hk-header.js">
<link rel="modulepreload" href="/hk/modules/hk-loader.js">
<link rel="modulepreload" href="/hk/modules/hk-pairs.js">
<link rel="modulepreload" href="/hk/cards/hk-strategy.js">
<style>
  html, body { margin: 0; min-height: 100%; background: #05070e; color: #fff;
               font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; }
  /* the view container (web/shim/mantel-shell.js): the sky mounts here, behind the view. The view is
     its DIRECT child, as hui-view is hui-view-container's in HA: the tab bar's room (--hk-tabbar-h)
     pads this element, and cards that fit the window (hk-calendar.js _measure) read it from the
     view's parent. */
  /* border-box: the tab bar's room is INSIDE the window's height, so a page that fits does not scroll
     (content-box made every page 100vh + --hk-tabbar-h tall: a 96 px scroll for nothing) */
  /* clear of the status bar and the Dynamic Island (the iPhone app and a Home Screen web app draw edge to
     edge): Home Assistant's header, or hk-kiosk.js's --safe-area-inset-top, does this there. Zero on a wall
     tablet or a desktop browser; a tab bar at the top sets its own padding-top inline (hk-tabbar.js). */
  /* 100dvh, the window as it shows now: on an iPad in Safari 100vh is the window with its toolbars hidden, so a
     Home Grid that fits the window (100dvh) still scrolled by the toolbars' height beside the docked menu, where
     no tab bar's rule (hk-tabbar.js barRoomCss) stands in for this one (2026-10-27) */
  hk-view-container { display: block; position: relative; isolation: isolate; min-height: 100vh; min-height: 100dvh;
                      box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
  /* the Music page's Now Playing sheet on a phone (hk-music.js, `hk-music-sheet` while it is up): its z-index
     cannot leave this isolated container, so the tab bar (6) and the playing bar (7) in #hk-shell-root drew over
     it and took its taps. While it is up the container stands at 7, after the shell root: over both, under the
     detail sheets (8) and the menu (9); and the page behind it does not scroll. */
  html[hk-music-sheet] hk-view-container { z-index: 7; }
  html[hk-music-sheet], html[hk-music-sheet] body { overflow: hidden; }
</style>
</head>
<body>
<div id="hk-shell-root"></div>
<hk-view-container id="view"></hk-view-container>
<script type="module" src="/web/shim/early-cards.js"></script>
<script type="module" src="/web/home.js"></script>
</body>
</html>
