# Mantel Server: Docker Compose stack for plain Docker and for the Proxmox LXC (PLAN §8).
#
#   cp .env.example .env          # edit: hostname, HA address (no secrets in .env)
#   (create the secret files: see secrets/README.md)
#   docker compose up -d --wait
#   docker compose --profile tunnel up -d --wait        # only if you use the Cloudflare tunnel (PLAN §7 way 2)
#
# TLS, four ways (docs/OPERATIONS.md "HTTPS"): this file's Caddy with your domain (DNS-01, the default) or
# with its own CA (MANTEL_TLS_SNIPPET=./caddy/tls-internal.caddy); your own reverse proxy instead of Caddy
# (add compose.byo-proxy.yaml); and the Cloudflare tunnel (--profile tunnel) beside any of them.
#
# Written in a deliberately plain YAML subset (no anchors, merge keys or block scalars) so that
# tools/package_check.py can verify the hardening below without a YAML library. Keep it that way.
#
# Hardening on every service: cap_drop ALL (Caddy adds back NET_BIND_SERVICE only), no-new-privileges,
# read-only root filesystem with a small tmpfs /tmp, memory/CPU/pids limits, a healthcheck, secrets as
# files. No service mounts the Docker socket. Only Caddy (443), go2rtc (WebRTC 8555) and mantel-server's Intercom
# listener (8767: plain HTTP, one-time links for Music Assistant only, closed until the Intercom is on) publish ports;
# compose.byo-proxy.yaml adds mantel-server's 8765, compose.connect.yaml its 8766.
#
# Networks:
#   backend  internal, 172.31.251.0/28, no route out : caddy (fixed .2: Mantel's one trusted proxy) <-> mantel-server <-> go2rtc
#   egress   normal bridge          : caddy (ACME, published 443), mantel-server (HA/MA/internet), go2rtc (cameras, tuner)
#   tunnel   internal, 172.31.250.0/29 : caddy and cloudflared ONLY. cloudflared can reach nothing else.
#   cf_out   normal bridge          : cloudflared alone, for its outbound connection to Cloudflare

name: mantel

services:
  caddy:
    image: ${MANTEL_CADDY_IMAGE:-mantel-caddy:local}
    build:
      context: ../docker
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "${MANTEL_HTTPS_PORT:-443}:443"
    environment:
      MANTEL_HOSTNAME: ${MANTEL_HOSTNAME:?set MANTEL_HOSTNAME in .env}
      MANTEL_CLOUDFLARED_IP: 172.31.250.3
      MANTEL_CADDY_TUNNEL_IP: 172.31.250.2
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MANTEL_TLS_SNIPPET:-./caddy/tls-dns01.caddy}:/etc/caddy/tls.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=32m
    secrets:
      - cloudflare_dns_token
    networks:
      backend:
        ipv4_address: 172.31.251.2
      egress: {}
      tunnel:
        ipv4_address: 172.31.250.2
    depends_on:
      mantel-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mantel-server:
    image: ${MANTEL_SERVER_IMAGE:-mantel-server:local}
    container_name: mantel-server
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      target: server
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    # Settings are plain variables (nothing secret). HA/MA tokens are set on the admin page (Connections) and
    # sealed on the data volume; an installation's token files under /run/secrets still work.
    environment:
      # optional: Home Assistant is normally set up on the admin page (/admin, Connections) after the
      # first start; an address here plus the ha_token file is shown there as "set by the installation"
      MANTEL_HA_URL: ${MANTEL_HA_URL:-}
      MANTEL_PUBLIC_URL: https://${MANTEL_HOSTNAME:?set MANTEL_HOSTNAME in .env}/
      MANTEL_ALLOW_HOSTS: ${MANTEL_ALLOW_HOSTS:-}
      MANTEL_HA_TOKEN_FILE: /run/secrets/ha_token
      MANTEL_DATA_DIR: /data
      MANTEL_PORT: "8765"
      # The Intercom's listener for Music Assistant (phase 17, docs/phase17/INTERCOM.md): the container port below.
      # Plain HTTP, serves only one-time links, and listens only while the Intercom is on in Mantel Settings; it is
      # not behind Caddy or your proxy. Published on the host as MANTEL_STREAM_BIND:MANTEL_STREAM_PORT.
      MANTEL_STREAM_INTERNAL_PORT: "8767"
      # Caddy's fixed address on the backend network: the only peer whose X-Mantel-Door: lan (and
      # X-Forwarded-For) Mantel believes. Caddy reaches Mantel by the backend-only alias below, so its
      # connections always come from this address. Without it every request counts as the tunnel door.
      MANTEL_TRUSTED_PROXY: 172.31.251.2
      MANTEL_BACKUP_TARGET: ${MANTEL_BACKUP_TARGET:-}
      # how this stack was installed (the LXC's installer sets lxc): Mantel Settings -> About says how to update it
      MANTEL_INSTALL: ${MANTEL_INSTALL:-}
      # first start only: seeds for Mantel Settings -> General (House Default Screen, Sign-Ins from Away Last);
      # once Settings holds a value these are ignored. Empty = the built-in default.
      MANTEL_DEFAULT_SCREEN: ${MANTEL_DEFAULT_SCREEN:-}
      MANTEL_SESSION_HOURS: ${MANTEL_SESSION_HOURS:-}
      MANTEL_MA_URL: ${MANTEL_MA_URL:-}
      # Live TV served by Mantel (docs/phase4/FEATURE-PARITY.md): the stack's own go2rtc, on the backend
      # network (no login; never given to a page). Mantel sets each channel up there when a screen tunes in.
      # Its viewing paths are also served to pages under Mantel's own /go2rtc/ (behind sign-in).
      MANTEL_GO2RTC_URL: http://go2rtc:1984
      # Music Assistant's web app (default: the host of the MA address), framed by HK through Mantel's /ma/
      MANTEL_MA_WEB_URL: ${MANTEL_MA_WEB_URL:-}
      # Mantel sets its own CSP/HSTS (security_headers.py): extra origins for HK's pages, and who may frame them
      MANTEL_CONNECT_SRC: ${MANTEL_CONNECT_SRC:-}
      MANTEL_FRAME_SRC: ${MANTEL_FRAME_SRC:-}
      MANTEL_FRAME_ANCESTORS: ${MANTEL_FRAME_ANCESTORS:-}
      MANTEL_PROXY_KIND: caddy
      # Cloudflare Access in front of the tunnel (optional, recommended): the Zero Trust team name and the Access
      # application's AUD tag. With both, Mantel refuses every tunnel request without a valid Access assertion
      MANTEL_CF_ACCESS_TEAM: ${MANTEL_CF_ACCESS_TEAM:-}
      MANTEL_CF_ACCESS_AUD: ${MANTEL_CF_ACCESS_AUD:-}
      # the kill switch: 1 keeps the house read-only whatever Mantel Settings (General) says
      MANTEL_READ_ONLY: ${MANTEL_READ_ONLY:-}
    volumes:
      - mantel-data:/data
      # the nightly encrypted backup's target (the NAS mount on the host); off unless
      # MANTEL_BACKUP_TARGET is set to /backups
      - ${MANTEL_BACKUP_DIR:-./backups}:/backups
    tmpfs:
      - /tmp:size=64m
    # Mantel's own page (8765) is published only by compose.byo-proxy.yaml; this is the Intercom's listener, which
    # Music Assistant fetches from. Keep it on the home network (MANTEL_STREAM_BIND, or the firewall).
    ports:
      - "${MANTEL_STREAM_BIND:-0.0.0.0}:${MANTEL_STREAM_PORT:-8767}:8767"
    secrets:
      - ha_token
      - ma_token
      - at_rest.key
      - backup.key
    # The secret files are root:10001 0440 on the host; the image's user has primary gid 10001.
    group_add:
      - "10001"
    networks:
      backend:
        # every service on backend has a fixed address: Docker hands out the lowest free one, so an
        # unpinned service that starts first would take Caddy's .2 and Caddy could not start
        ipv4_address: 172.31.251.3
        aliases:
          - mantel-backend
      egress: {}
    healthcheck:
      test: ["CMD", "python", "-m", "mantel_server.health", "--port", "8765"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  go2rtc:
    image: ${MANTEL_TRANSCODE_IMAGE:-mantel-transcode:local}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      target: transcode
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 3.0
    pids_limit: 256
    environment:
      MANTEL_LAN_IP: ${MANTEL_LAN_IP:?set MANTEL_LAN_IP in .env (the address tablets reach this host at)}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    tmpfs:
      - /tmp:size=128m
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"
    networks:
      backend:
        ipv4_address: 172.31.251.4
      egress: {}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:1984/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # /dev/dri (QuickSync) is added by compose.gpu.yaml when the host has one.

  cloudflared:
    profiles:
      - tunnel
    image: ${MANTEL_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2025.9.1@sha256:4604b477520dc8322af5427da68b44f0bf814938e9d2e4814f2249ee4b03ffdf}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflared_token"]
    secrets:
      - cloudflared_token
    group_add:
      - "10001"
    # Reaches only Caddy's tunnel door (http://172.31.250.2:8080): set that as the public hostname's
    # service in the Cloudflare dashboard. Cloudflare Access in front of it is recommended; with
    # MANTEL_CF_ACCESS_TEAM / MANTEL_CF_ACCESS_AUD set, Mantel checks Access's assertion on every tunnel request.
    networks:
      tunnel:
        ipv4_address: 172.31.250.3
      cf_out: {}

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.251.0/28
  egress: {}
  tunnel:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/29
  cf_out: {}

volumes:
  mantel-data: {}
  caddy-data: {}
  caddy-config: {}

# Secrets are files on the host (default /etc/hk/secrets, root:10001, mode 0440), mounted read-only at
# /run/secrets/<name>. Never environment variables, never in the image or the repo (secrets/README.md).
secrets:
  ha_token:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/ha_token
  ma_token:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/ma_token
  # named after the files the server reads in --secrets-dir (/run/secrets): the at-rest key seals
  # TOTP seeds and device keys in SQLite; the backup key encrypts the nightly backup
  at_rest.key:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/at_rest.key
  backup.key:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/backup.key
  cloudflare_dns_token:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/cloudflare_dns_token
  cloudflared_token:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/cloudflared_token
