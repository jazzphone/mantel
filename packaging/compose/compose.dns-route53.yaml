# HTTPS with your own domain through Amazon Route 53 (DNS-01): Caddy's DNS snippet and its secret file(s).
#
#   COMPOSE_FILE=compose.yaml:compose.dns-route53.yaml        (in .env; add others with ':' as usual)
#
# This mounts caddy/tls-dns01-route53.caddy as Caddy's TLS snippet (MANTEL_TLS_SNIPPET is not used then) and
# gives Caddy, and only Caddy, the secret file(s) route53_access_key_id and route53_secret_access_key from the secret folder
# (secrets/README.md). Same plain YAML subset as compose.yaml (tools/package_check.py reads it).

services:
  caddy:
    volumes:
      - ./caddy/tls-dns01-route53.caddy:/etc/caddy/tls.caddy:ro
    secrets:
      - route53_access_key_id
      - route53_secret_access_key

secrets:
  route53_access_key_id:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/route53_access_key_id
  route53_secret_access_key:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/route53_secret_access_key
