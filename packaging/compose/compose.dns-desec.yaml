# HTTPS with your own domain through deSEC (DNS-01): Caddy's DNS snippet and its secret file(s).
#
#   COMPOSE_FILE=compose.yaml:compose.dns-desec.yaml        (in .env; add others with ':' as usual)
#
# This mounts caddy/tls-dns01-desec.caddy as Caddy's TLS snippet (MANTEL_TLS_SNIPPET is not used then) and
# gives Caddy, and only Caddy, the secret file(s) desec_token from the secret folder
# (secrets/README.md). Same plain YAML subset as compose.yaml (tools/package_check.py reads it).

services:
  caddy:
    volumes:
      - ./caddy/tls-dns01-desec.caddy:/etc/caddy/tls.caddy:ro
    secrets:
      - desec_token

secrets:
  desec_token:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/desec_token
