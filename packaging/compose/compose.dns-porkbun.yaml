# HTTPS with your own domain through Porkbun (DNS-01): Caddy's DNS snippet and its secret file(s).
#
#   COMPOSE_FILE=compose.yaml:compose.dns-porkbun.yaml        (in .env; add others with ':' as usual)
#
# This mounts caddy/tls-dns01-porkbun.caddy as Caddy's TLS snippet (MANTEL_TLS_SNIPPET is not used then) and
# gives Caddy, and only Caddy, the secret file(s) porkbun_api_key and porkbun_secret_api_key from the secret folder
# (secrets/README.md). Same plain YAML subset as compose.yaml (tools/package_check.py reads it).

services:
  caddy:
    volumes:
      - ./caddy/tls-dns01-porkbun.caddy:/etc/caddy/tls.caddy:ro
    secrets:
      - porkbun_api_key
      - porkbun_secret_api_key

secrets:
  porkbun_api_key:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/porkbun_api_key
  porkbun_secret_api_key:
    file: ${MANTEL_SECRETS_DIR:-/etc/hk/secrets}/porkbun_secret_api_key
