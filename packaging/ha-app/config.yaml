# Mantel as a Home Assistant App (add-on), installed as a LOCAL App: tools/stage_ha_app.py assembles
# this folder with Mantel's code into HA's local apps share, and the Supervisor builds the Dockerfile
# next to this file (no `image:` key: a local build). docs/phase3/HA-APP.md has the install steps.
name: Mantel
version: "0.1.42"
slug: mantel
description: HK's home screens, served by Mantel Server inside Home Assistant (sign-in through the sidebar)
url: https://github.com/jazzphone/mantel
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: true
# The sidebar page (Ingress) is always on. HA's Ingress adds the signed-in HA user to each request; Mantel
# believes it only from the Supervisor's Ingress proxy (172.30.32.2), and only on the Ingress port.
ingress: true
ingress_port: 8099
panel_icon: mdi:fireplace
panel_title: Mantel
# Every HA user may open the panel (decision 21: wall tablets come through it, and neither tablets nor most
# household members are HA administrators). Mantel decides who gets anything: an unlinked HA user sees only
# "Not linked yet", and only an HA administrator (checked with HA itself) can become the first Owner.
panel_admin: false
# HA's built-in App credential (SUPERVISOR_TOKEN, to ws://supervisor/core/websocket). No user token.
homeassistant_api: true
# Mantel Link's "Discovered: Mantel" (docs/phase9/MANTEL-LINK.md): at start the App announces Mantel to the
# Supervisor (its own address on HA's App network and a rotated `linked` Service credential), which hands it to
# Mantel Link in Home Assistant. hassio_api is for that announcement and the App's own hostname only.
hassio_api: true
discovery:
  - mantel
watchdog: "http://[HOST]:[PORT:8099]/healthz"
# Home Assistant's backups stop the App, copy /data and start it again ("cold"). Mantel's database is SQLite
# in WAL mode: a hot copy of mantel.db and mantel.db-wal taken file by file while Mantel writes (and
# checkpoints) can restore as a damaged or inconsistent database. Stopped, the files are at rest and the copy
# is exact, photos and keys included. The cost is Mantel being away for the length of the App's part of the
# backup. A backup_pre snapshot would keep it running but needs a restore-time step to put the snapshot in
# place; cold needs nothing and cannot go wrong.
backup: cold
# Direct access (decision 26, DOCS.md "Direct access"): Mantel's own address for tablets and devices at
# home. Off unless the option `access` is proxy (plain HTTP here, for your own proxy) or https (Mantel serves
# HTTPS here with its own certificate), AND a host port is set for it in the App's Network section (null:
# not published). Requests on it are never Ingress: Mantel's own sign-in and rules apply.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Direct access (only with Access set to proxy or https; Ingress keeps working either way)"
options:
  commands_enabled: false
  log_level: info
  default_screen: ""
  session_hours: 12
  ha_door_rules: trusted
  # Music Assistant (Phase 4, docs/OPERATIONS.md "Music Assistant"): empty leaves Mantel's music engine off.
  # The token is a masked option; the entrypoint moves it into a private file (never args, env or logs).
  ma_url: ""
  ma_token: ""
  # Direct access (DOCS.md): ingress (default: the sidebar only), proxy (your own reverse proxy) or https
  # (Mantel's built-in HTTPS). The Cloudflare token is a masked option, moved into a private file like ma_token.
  access: ingress
  public_url: ""
  trusted_proxies: ""
  ha_sign_in_url: ""
  ha_frame_origins: ""
  cloudflare_token: ""
  acme_email: ""
  acme_staging: false
  lan_networks: ""
  # Cloudflare Access in front of a tunnel to the direct port (DOCS.md): the Zero Trust team name and the Access
  # application's AUD tag. Both empty (the default): not checked. Neither is a secret.
  cf_access_team: ""
  cf_access_aud: ""
schema:
  commands_enabled: bool
  log_level: list(debug|info|warning|error)
  default_screen: str?
  session_hours: float(1,720)
  ha_door_rules: list(trusted|lan|tunnel)
  ma_url: "str?"
  ma_token: "password?"
  access: list(ingress|proxy|https)
  public_url: "str?"
  trusted_proxies: "str?"
  ha_sign_in_url: "str?"
  ha_frame_origins: "str?"
  cloudflare_token: "password?"
  acme_email: "str?"
  acme_staging: bool
  lan_networks: "str?"
  cf_access_team: "str?"
  cf_access_aud: "str?"
