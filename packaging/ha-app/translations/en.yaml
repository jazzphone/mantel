configuration:
  commands_enabled:
    name: Allow house commands
    description: Off by default (read-only). When on, signed-in people may control the house through Mantel within their Mantel roles (only the alarm asks for a code, the house Alarm PIN), and every command is audited.
  log_level:
    name: Log level
    description: How much Mantel writes to this App's log.
  default_screen:
    name: Default screen
    description: The HK dashboard the sidebar opens (its address, for example dashboard-kitchen).
  ha_door_rules:
    name: Sidebar access rules
    description: trusted (default) treats being signed in to Home Assistant as enough, as HK in Home Assistant always was; lan uses the home network's rules; tunnel uses Mantel's remote-access rules (each role's remote switches). Either way only the alarm asks for a code, the house Alarm PIN.
  ma_url:
    name: Music Assistant address
    description: Music Assistant's own API, for example http://music-assistant.local:8095 (its WebSocket API is at /ws). Empty (the default) leaves Mantel's music engine off, and the Music page keeps reading Home Assistant's. Together with the token below, Mantel runs whole-home music itself.
  ma_token:
    name: Music Assistant token
    description: A long-lived token made in Music Assistant for Mantel alone. Kept by the Supervisor as a masked option; Mantel reads it from a private file and never logs it.
  access:
    name: Direct access
    description: ingress (default) keeps Mantel in Home Assistant's sidebar only. proxy also serves Mantel on this App's direct port (plain HTTP) for your own reverse proxy, such as Nginx Proxy Manager, to put HTTPS in front. https has Mantel serve HTTPS on that port itself, with a Let's Encrypt certificate it renews (DNS through Cloudflare). Either way set a host port for 8100/tcp under Network; the sidebar keeps working.
  public_url:
    name: Mantel's own address
    description: With proxy or https, the address tablets and browsers type, for example https://mantel.example.com (add :port when it is not 443). A name, not an IP address; your DNS must point it at your proxy (proxy) or at this Home Assistant machine (https).
  trusted_proxies:
    name: Your proxy's address
    description: With proxy, the IP address (or several, separated by commas) your reverse proxy's requests come from, as Mantel sees them. Mantel's Test my proxy page shows it. Only this proxy may tell Mantel the LAN door, and only with this installation's door key (Mantel Settings, HTTPS).
  ha_sign_in_url:
    name: Home Assistant address for sign-in
    description: With proxy or https, Home Assistant's address as browsers at home know it, for example http://homeassistant.local:8123. It turns on Sign in with Home Assistant at Mantel's own address. Empty leaves only Mantel's own sign-in there (password, passkey, enrolled wall tablets).
  ha_frame_origins:
    name: Home Assistant addresses that may show Mantel
    description: With proxy or https, Home Assistant's other addresses (separated by commas), for example https://ha.example.com, so a Webpage dashboard there can show a Mantel screen in Home Assistant's sidebar. The sign-in address above is always allowed. Only these Home Assistant pages may put Mantel in a frame.
  cloudflare_token:
    name: Cloudflare DNS token
    description: With https, a Cloudflare API token limited to Zone / Zone / Read and Zone / DNS / Edit on the zone holding Mantel's address, used only to prove the name to Let's Encrypt. Kept by the Supervisor as a masked option; Mantel reads it from a private file and never logs it.
  acme_email:
    name: Certificate e-mail
    description: Optional. Let's Encrypt's contact for this certificate's account.
  acme_staging:
    name: Test certificates
    description: With https, use Let's Encrypt's staging service (certificates browsers do not trust) while trying the setup out, so failed attempts do not count against the real service's limits.
  lan_networks:
    name: Home networks
    description: With https, the networks (for example 192.0.2.0/24, separated by commas) whose devices get the home's rules at Mantel's own address; everything else gets the remote rules. Empty means the private ranges. Home Assistant's internal network never counts, so a device must reach this machine directly, not through the router's port forwarding.
