name: Tests

# by hand only (Actions -> Tests -> Run workflow): the checks run on the developer's Mac, with tools/ci.py and its
# pre-push hook (docs/development/Building-and-Testing.md, "Local checks")
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Docs links, packaging, private words
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_links.py
      - run: python tools/package_check.py --release
      # one version number: the App's config.yaml, the Connect App's and pyproject.toml (Releasing.md)
      - run: python tools/check_version.py
      # the words are a repository secret (one regular expression), never a file in the repository
      - run: python tools/check_private.py
        env:
          HK_PRIVATE: ${{ secrets.HK_PRIVATE }}

  server:
    name: Mantel Server and shared Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # esbuild, the minifier build_static.py runs on every .js and .css file (tools/package.json pins it)
      - run: npm ci --prefix tools --no-audit --no-fund
      # test what ships: the images install packaging/docker/requirements.lock. pip will not mix hashes with an
      # editable install, so the same versions go in as a constraints file (pins only, the hashes left out)
      - run: sed -e 's/ *\\$//' -e '/^ *--hash=/d' -e '/^ *#/d' packaging/docker/requirements.lock > "$RUNNER_TEMP/constraints.txt"
      - run: pip install -e '.[dev]' -c "$RUNNER_TEMP/constraints.txt"
      - run: python -m pytest -q -p no:cacheprovider
        # (speed budgets are measured on the owner's Mac, by tools/ci.py and the pre-push hook; on a shared runner beside
        # three other workers the timeline's write p95 once took 20.9 ms against 15 and failed 0.1.146's first run)
        env:
          MANTEL_SKIP_PERF: "1"

  home-assistant:
    name: HK Frontend and Mantel Link (Home Assistant test harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # the harness release the suites were last run with (Home Assistant 2026.9.3)
      - run: pip install pytest-homeassistant-custom-component==0.13.366
      - run: python tools/build_ha.py build/ha
      - run: cd build/ha/tests/py && pytest -q -p no:cacheprovider
      - run: cd hosts/ha/custom_components/mantel/tests/py && pytest -q -p no:cacheprovider
        env:
          HK_FRONTEND_COMPONENT: ${{ github.workspace }}/build/ha/custom_components/hk_frontend
          MANTEL_ROOT: ${{ github.workspace }}

  javascript:
    # HK's card suites run on JavaScriptCore, which every macOS runner has
    name: HK Frontend cards (JavaScriptCore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_ha.py build/ha
      - run: sh build/ha/tests/run
