<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercom sheet mockup (2026-11-05)</title>
<!--
  A MOCKUP, not the sheet: one file, no Mantel code. ?state=idle|rec|sent|live and the window's width choose what it shows.
  Values from DESIGN.md: the sheet's 38 corner (30 on a phone), overlay rgba(28,28,32,.52) over blur(34px) saturate(1.9),
  ink .94 / .68 / .40, key .10 / key-strong .18, line .10, the label role (13 / 600 / .3 uppercase, ink-2), title 22 / 700,
  capsule pills, SP spacing (region 20, piece 20 / phone 16, block 12), the phone breakpoint 640 and the upright tablet 860.
  The talk button is the Lock sheet's: a 264 ring (228 on a phone) around a 192 core (166), a big word under it.
-->
<style>
  :root {
    --ink: rgba(255,255,255,.94); --ink-2: rgba(255,255,255,.68); --ink-3: rgba(255,255,255,.40);
    --key: rgba(255,255,255,.10); --key-strong: rgba(255,255,255,.18); --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.18);
    --blue: #0a84ff; --red: #ff453a; --green: #30d158;
    --std: cubic-bezier(.32,.72,0,1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 500 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(120% 90% at 20% 10%, #2f7d6b 0%, #1d5a4d 45%, #133d36 100%);
    display: grid; place-items: center; padding: 24px; -webkit-font-smoothing: antialiased;
  }

  .sheet {
    position: relative; width: min(980px, 100%); border-radius: 38px; padding: 20px 20px 22px;
    background: rgba(28,28,32,.52); -webkit-backdrop-filter: blur(34px) saturate(1.9); backdrop-filter: blur(34px) saturate(1.9);
    box-shadow: 0 0 0 .5px rgba(255,255,255,.14) inset, 0 30px 80px rgba(0,0,0,.35);
  }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .head .well { width: 42px; height: 42px; border-radius: 21px; background: var(--key); display: grid; place-items: center; }
  .head h1 { font-size: 22px; font-weight: 700; letter-spacing: -.35px; flex: 1; }
  .x { width: 42px; height: 42px; border-radius: 21px; background: var(--key); border: 0; color: var(--ink); display: grid; place-items: center; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: var(--key); }
  .seg b { text-align: center; padding: 9px 0; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--ink); }
  .seg b.on { background: rgba(255,255,255,.94); color: #1c1c1e; }

  /* WIDE: the talk side and the rooms side */
  .body { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: stretch; }
  .talk { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 4px 0 6px; }
  .talk .seg { width: 100%; }
  .rooms { border-radius: 20px; background: rgba(255,255,255,.06); padding: 18px; display: flex; flex-direction: column; gap: 12px;
           min-width: 0; }

  /* THE TALK BUTTON: the Lock sheet's ring and core */
  .btn { position: relative; width: 264px; height: 264px; border-radius: 132px; border: 0; padding: 0; background: rgba(10,132,255,.16);
         display: grid; place-items: center; margin-top: 6px; }
  .btn svg.ring { position: absolute; inset: 0; }
  .btn .trk { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 8; }
  .btn .prg { fill: none; stroke: var(--blue); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 704; stroke-dashoffset: 704; }
  .btn .core { width: 192px; height: 192px; border-radius: 96px; background: var(--blue); display: grid; place-items: center;
               box-shadow: 0 0 0 0 rgba(255,69,58,0); }
  .btn .core svg { width: 76px; height: 76px; fill: #fff; }
  .rec .btn { background: rgba(255,69,58,.16); }
  .rec .btn .core { background: var(--red); box-shadow: 0 0 0 14px rgba(255,69,58,.22); }
  .rec .btn .prg { stroke: var(--red); stroke-dashoffset: 610; }          /* 4 s of a 30 s Message */
  .live .btn { background: rgba(48,209,88,.16); }
  .live .btn .core { background: var(--green); box-shadow: 0 0 0 14px rgba(48,209,88,.22); }
  .live .btn .prg { stroke: var(--green); stroke-dashoffset: 560; }
  .word { text-align: center; }
  .word .big { font-size: 38px; font-weight: 600; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .word .hint { font-size: 16px; color: var(--ink-2); margin-top: 4px; }
  .after { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .after b { padding: 9px 18px; border-radius: 999px; background: var(--key); font-weight: 600; font-size: 15px; }
  .done { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-weight: 600; font-size: 16px; }

  /* ROOMS */
  .rhead { display: flex; align-items: baseline; justify-content: space-between; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-2); }
  .link { font-size: 15px; font-weight: 600; color: var(--blue); }
  .link.off { color: var(--ink-3); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--key); font-weight: 600; font-size: 15px; }
  .chip.on { background: rgba(255,255,255,.94); color: #1c1c1e; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .grid > * { min-width: 0; }
  .room { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 14px 8px 10px; border-radius: 16px;
          background: var(--key); }
  .room .tick { width: 26px; height: 26px; border-radius: 13px; box-shadow: inset 0 0 0 2px var(--line-strong); flex: none;
                display: grid; place-items: center; }
  .room.on { background: rgba(255,255,255,.94); color: #1c1c1e; }
  .room.on .tick { background: var(--blue); box-shadow: none; }
  .room.on .tick svg { display: block; }
  .room .tick svg { display: none; width: 15px; height: 15px; fill: #fff; }
  .room .n { flex: 1; min-width: 0; }
  .room .n b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room .n i { display: block; font-style: normal; font-size: 13px; color: var(--ink-3); }
  .room.on .n i { color: rgba(28,28,30,.55); }
  .room.skip { opacity: .45; }
  .glyph { width: 18px; height: 18px; flex: none; fill: currentColor; opacity: .7; }
  .count { font-size: 13px; color: var(--ink-3); }

  /* UPRIGHT TABLET (to 860): the button above, the rooms below */
  @media (max-width: 860px) {
    .body { grid-template-columns: 1fr; }
    .talk { padding-bottom: 0; }
    .talk .seg { max-width: 420px; }
  }
  /* PHONE (to 640): the Lock sheet's phone button; the rooms a compact list */
  @media (max-width: 640px) {
    body { padding: 0; align-items: end; }
    .sheet { border-radius: 30px 30px 0 0; padding: 16px 16px 26px; }
    .head { margin-bottom: 16px; }
    .body { gap: 16px; }
    .btn { width: 228px; height: 228px; border-radius: 114px; }
    .btn .core { width: 166px; height: 166px; border-radius: 83px; }
    .btn .core svg { width: 64px; height: 64px; }
    .word .big { font-size: 32px; }
    .rooms { padding: 14px; }
    .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .room { min-height: 48px; }
    .room { padding: 7px 10px 7px 8px; gap: 8px; }
    .room .tick { width: 22px; height: 22px; border-radius: 11px; }
    .room .n i { display: none; }            /* the floor is in the chips above */
    .room .n b { white-space: normal; line-height: 1.15; }   /* a long name takes two lines, never an ellipsis */
    .room .glyph { display: none; }          /* the button says Live */
  }
</style>
</head>
<body>
<section class="sheet" id="sheet"></section>
<script>
  const q = new URLSearchParams(location.search), state = q.get('state') || 'idle';
  const MIC = '<svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3m7 9c0 3.53-2.61 6.44-6 6.93V21h-2v-3.07c-3.39-.49-6-3.4-6-6.93h2a5 5 0 0 0 10 0z"/></svg>';
  const STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
  const WAVE = '<svg viewBox="0 0 24 24"><path d="M11 3h2v18h-2zM7 7h2v10H7zM15 6h2v12h-2zM3 10h2v4H3zM19 9h2v6h-2z"/></svg>';
  const TICK = '<svg viewBox="0 0 24 24"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L20.1 8.4 18.7 7z"/></svg>';
  const CLOSE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>';
  const rooms = [
    ['Guest Bedroom', 'Upstairs'], ['Kitchen', 'Main Floor'], ['Master Bathroom', 'Upstairs'], ['Master Bedroom', 'Upstairs'],
    ['Living Room', 'Main Floor · 2 speakers'], ['A Bedroom', 'Upstairs'], ['Loft', 'Upstairs'], ['Extra Room', 'Downstairs'],
    ['Office', 'Main Floor · 2 speakers'],
  ];
  const picked = state === 'idle' ? new Set([1, 4]) : new Set([0, 1, 2, 3, 4, 5, 6, 7, 8]);
  const live = state === 'live';
  const word = {
    idle: ['Tap to Talk', 'A message plays when you stop'],
    rec: ['0:04', 'Tap to send · 0:30 at most'],
    sent: ['Tap to Talk', ''],
    live: ['Live', 'About 7 s behind you · let go to finish'],
  }[state];
  const after = state === 'sent'
    ? '<div class="done">' + TICK.replace('<svg', '<svg width="18" height="18" fill="currentColor"') + 'Sent to 9 rooms</div>' +
      '<div class="after"><b>Play</b><b>Send Again</b></div>'
    : '';
  const chips = ['Whole House', 'Main Floor', 'Upstairs', 'Downstairs'].map((c, i) =>
    '<span class="chip' + (state !== 'idle' && i === 0 ? ' on' : '') + '">' + c + '</span>').join('');
  const grid = rooms.map(([n, f], i) => {
    const on = picked.has(i);
    const g = live && on ? WAVE.replace('<svg', '<svg class="glyph"') : '';
    return '<div class="room' + (on ? ' on' : '') + '"><span class="tick">' + TICK + '</span><span class="n"><b>' + n +
      '</b><i>' + f + '</i></span>' + g + '</div>';
  }).join('');
  document.body.classList.add(state);
  document.getElementById('sheet').innerHTML =
    '<div class="head"><span class="well">' + MIC.replace('<svg', '<svg width="22" height="22" fill="currentColor"') +
    '</span><h1>Intercom</h1><button class="x" aria-label="Close">' + CLOSE + '</button></div>' +
    '<div class="body"><div class="talk"><div class="seg"><b class="' + (live ? '' : 'on') + '">Message</b><b class="' +
    (live ? 'on' : '') + '">Live</b></div>' +
    '<button class="btn" aria-label="' + word[0] + '"><svg class="ring" viewBox="0 0 236 236"><circle class="trk" cx="118" cy="118" r="112"/>' +
    '<circle class="prg" cx="118" cy="118" r="112" pathLength="704" transform="rotate(-90 118 118)"/></svg><span class="core">' +
    (state === 'rec' ? STOP : live ? WAVE : MIC) + '</span></button>' +
    '<div class="word"><div class="big">' + word[0] + '</div>' + (word[1] ? '<div class="hint">' + word[1] + '</div>' : '') +
    after + '</div></div>' +
    '<div class="rooms"><div class="rhead"><span class="label">To</span><span class="count">' + picked.size + ' of 9</span>' +
    '<span class="link">Clear All</span></div><div class="chips">' + chips + '</div><div class="grid">' + grid + '</div></div></div>';
  document.querySelector('.rhead').style.gap = '12px';
  document.querySelector('.rhead .label').style.flex = '1';
</script>
</body>
</html>
