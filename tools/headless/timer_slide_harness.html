<!doctype html><meta charset="utf-8"><title>Timer Slide Harness</title>
<!-- tools/headless/timer_slide_check.py's page: the Timer slide alone (hk-saver-timers.js and hk-timers.js), at the size and
     with the timers the query names, a stand-in slide corner beside it (the screensaver's own is checked in
     saver_shows_check.py). Every name in it is fictional. -->
<style>html,body{margin:0;background:#000;overflow:hidden}#host{position:relative;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
.scn{position:absolute;inset:0;z-index:8;pointer-events:none;color:#fff}.scs{position:absolute;top:var(--m);display:flex;flex-direction:column;gap:6px}
.scs.tl{left:var(--m)}.scs.tr{right:var(--m);align-items:flex-end}.ct{font-weight:200;line-height:.82}.cl{font-weight:600;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.45)}</style>
<div id="host"></div>
<script>
var P = new URLSearchParams(location.search), W = +P.get('w') || 1280, H = +P.get('h') || 800;
var RAF = window.requestAnimationFrame.bind(window), rafs = 0;
window.requestAnimationFrame = function (f) { rafs++; return RAF(f); };
window.__rafs = function () { return rafs; };
window.hkLocale = { tag: function () { return 'en-US'; }, clock: function (o) { return o; } };
window.hkSettings = { get: function (k, d) { return k === 'features.house_timers' ? ['timer.nap_timer'] : d; } };
</script>
<script src="/hk/modules/hk-timers.js"></script>
<script src="/hk/modules/hk-saver-timers.js"></script>
<script>
// a stand-in for the cards' client, so hk-timer-ring.js sees what a screen would. `calls`: what its buttons sent.
window.__calls = []; window.__listeners = [];
window.hkCards = { onClient: function (f) { window.__listeners.push(f); }, client: function () { return window.__client || null; } };
window.__tablet = P.get('room') === null ? null : { room: P.get('room') };
window.hkSettings = Object.assign(window.hkSettings, { tablet: function () { return window.__tablet; } });
</script>
<script src="/hk/modules/hk-timer-ring.js"></script>
<script>
var host = document.getElementById('host'); host.style.width = W + 'px'; host.style.height = H + 'px';
var u = Math.min(W, H) / 100, m = 6 * u;
var scn = document.createElement('div'); scn.className = 'scn'; scn.style.setProperty('--m', m + 'px');
var tsz = (+P.get('tsz') || 100) / 100;
scn.innerHTML = '<div class="scs tl"><div class="ct" style="font-size:' + (2.7 * u * 2.6 * tsz) + 'px">9:41</div><div class="cl" style="font-size:' + 2.7 * u + 'px">Sunday, November 8</div><div class="cl" style="font-size:' + 2.7 * u + 'px">48° Partly Cloudy</div></div>' +
  '<div class="scs tr"><div class="cl" style="font-size:' + 2.7 * u + 'px">Disarmed</div></div>';
// timers=Name:secondsLeft:totalSeconds[:paused],...; hp=0,2: those are HomePods' timers (phase 28), mirrored as timer.hk_homepod_<i>
var HP = (P.get('hp') || '').split(',').filter(Boolean).map(Number);
function idOf(i) { return (HP.indexOf(i) >= 0 ? 'timer.hk_homepod_' : 'timer.hk_timer_') + i; }
function states() {
  var s = { 'timer.nap_timer': { state: 'active', attributes: { finishes_at: new Date(Date.now() + 5000).toISOString(), duration: '1:00:00', friendly_name: 'Nap' } } };
  (P.get('timers') || '').split(',').filter(Boolean).forEach(function (t, i) {
    var a = t.split(':'), left = +a[1], total = +a[2], hms = function (x) { return Math.floor(x / 3600) + ':' + Math.floor(x / 60) % 60 + ':' + x % 60; };
    s[idOf(i)] = a[3] ? { state: 'paused', attributes: { remaining: hms(left), duration: hms(total), friendly_name: a[0] } }
      : { state: 'active', attributes: { finishes_at: window.__t0(left), duration: hms(total), friendly_name: a[0] } };
  });
  return s;
}
var T0 = Date.now(); window.__t0 = function (left) { return new Date(T0 + left * 1000).toISOString(); };
var client = { states: states(), config: { time_zone: 'America/New_York' }, actions: { callService: function (d, s, data) { window.__calls.push([d, s, data]); return Promise.resolve(); } } };
// rings=Name,Name: ringing, on Mantel's sensor; where=none leaves it silent
function sensor(names) {
  var silent = P.get('where') === 'none';
  client.states['sensor.running_quick_timers'] = { state: '0', attributes: { running: (P.get('lede') ? Object.keys(client.states).filter(function (e) { return /^timer\.hk/.test(e) && client.states[e].state === 'active'; }).map(function (e) { return { entity_id: e, tablet: !silent, areas: ['kitchen'], speakers: silent ? [] : ['Kitchen'], tone: 'bell' }; }) : []), made: [],
    homepod: { state: P.get('hpstate') || 'ok', alarms: [], went_off: [], timers: HP.reduce(function (o, i) {
      o[idOf(i)] = { source: 'homepod', homepod: 'HomePod', home_room: 'Kitchen', room: 'kitchen', room_name: 'Kitchen', controls: ['pause', 'resume', 'cancel'] }; return o; }, {}) },
    ringing: names.map(function (n, i) {
      // hpring=1: a HomePod's, ringing on its HomePod (phase 28): no sound on a screen, Stop to the HomePod
      if (P.get('hpring')) return { entity_id: 'timer.hk_homepod_' + (40 + i), name: n, until: null, tablet: false, areas: ['kitchen'], speakers: [], tone: null, source: 'homepod',
        homepod: 'HomePod', room_name: 'Kitchen', ringing: true, controls: ['stop'] };
      return { entity_id: 'timer.hk_timer_' + (40 + i), name: n, until: 0, tablet: !silent, areas: ['kitchen'], speakers: silent ? [] : ['Kitchen'], tone: 'chime' }; }) } };
}
sensor((P.get('rings') || '').split(',').filter(Boolean));
window.__ring = function (names) { sensor(names); ctl.setClient(client); window.__listeners.forEach(function (f) { f(client); }); };
window.__client = client;
var ctl = window.hkSaverTimers.create({ h24: false });
host.appendChild(ctl.el); host.appendChild(scn);
ctl.layout(W, H);
window.__ctl = ctl; window.__client = client;
window.__ok = ctl.ready(client) && ctl.draw(client, P.get('look') || 'plain');
ctl.el.style.setProperty('--hk-tm-fade', '0ms'); ctl.el.classList.add('on'); ctl.layout(W, H);
window.__ready = true;
</script>
