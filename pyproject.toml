[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mantel"
version = "0.1.98"
description = "Mantel: Home Assistant dashboards inspired by Apple's Home app, with real accounts, roles, wall tablets and an audit log"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jazzphone" }]
requires-python = ">=3.12"
classifiers = ["Programming Language :: Python :: 3", "Framework :: AsyncIO", "Topic :: Home Automation",
               "Operating System :: OS Independent"]
dependencies = ["aiohttp>=3.9", "argon2-cffi>=25.1", "cryptography>=50.0", "webauthn>=3.0",
                "Pillow>=11.0",   # Your files photos and Mantel Photos are re-encoded (user_files.py, photos.py)
                "pillow-heif>=0.18",   # iPhone HEIC/HEIF photos (re-encoded to JPEG)
                "numpy>=2.0", "onnxruntime>=1.20",   # Mantel Photos' focus points: where faces are (faces.py, YuNet)
                "zeroconf>=0.140"]   # Docker/LXC: Mantel announced as _mantel._tcp (announce.py; the App uses the Supervisor)

[project.urls]
Homepage = "https://github.com/jazzphone/mantel"
Documentation = "https://github.com/jazzphone/mantel/tree/main/docs/guide"
Issues = "https://github.com/jazzphone/mantel/issues"
Changelog = "https://github.com/jazzphone/mantel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "pyyaml>=6", "pytest-xdist>=3.8"]
heic = ["pillow-heif>=0.18"]   # kept for old install commands: pillow-heif is now a dependency
apns-direct = ["httpx[http2]>=0.27"]   # sending to Apple with your own APNs key (apns.py; HTTP/2). The relay needs none

[project.scripts]
mantel-server = "mantel_server.__main__:main"

[tool.setuptools.packages.find]
where = ["hosts/server", "."]
include = ["mantel_server*", "mantel_connect*", "hk_core*"]
exclude = ["hk_core.link*"]     # Home Assistant's side: the integrations vendor it

[tool.setuptools.package-data]
mantel_server = ["static/*", "static/admin/*", "static/login/*", "static/proxy-check/*", "migrations/*.sql", "hk_writes.json", "models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hosts/server", "."]
asyncio_mode = "auto"
