[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantel"
version = "0.0.1"
description = "Mantel: HK as its own platform (Mantel Server, shared core, hosts)"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "argon2-cffi>=25.1", "cryptography>=50.0", "webauthn>=3.0",
                "Pillow>=11.0",   # Your files photos are re-encoded (user_files.py)
                "zeroconf>=0.140"]   # Docker/LXC: Mantel announced as _mantel._tcp (announce.py; the App uses the Supervisor)

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]
heic = ["pillow-heif>=0.18"]   # accept iPhone HEIC photos in Your files (re-encoded to JPEG)

[project.scripts]
mantel-server = "mantel_server.__main__:main"

[tool.setuptools.packages.find]
where = ["hosts/server", "."]
include = ["mantel_server*", "mantel_connect*", "hk_core*"]

[tool.setuptools.package-data]
mantel_server = ["static/*", "static/admin/*", "static/login/*", "static/proxy-check/*", "migrations/*.sql", "hk_writes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hosts/server", "."]
asyncio_mode = "auto"
