[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantel"
version = "0.0.1"
description = "Mantel: HK as its own platform (Mantel Server, shared core, hosts)"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[project.scripts]
mantel-server = "mantel_server.__main__:main"

[tool.setuptools.packages.find]
where = ["hosts/server", "."]
include = ["mantel_server*", "hk_core*"]

[tool.setuptools.package-data]
mantel_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hosts/server", "."]
asyncio_mode = "auto"
